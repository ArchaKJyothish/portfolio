<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tasks - My To-Do List</title>
<style>
  :root {
    --bg1: #0f172a;
    --bg2: #1e1b4b;
    --card: rgba(255, 255, 255, 0.07);
    --card-border: rgba(255, 255, 255, 0.12);
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #818cf8;
    --accent2: #c084fc;
    --danger: #f87171;
    --done: #64748b;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 100%);
    background-attachment: fixed;
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .app { width: 100%; max-width: 520px; }
  header { text-align: center; margin: 24px 0 28px; }
  header .date { color: var(--muted); font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; }
  header h1 {
    font-size: 2.4rem; font-weight: 800; margin-top: 6px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 18px;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.35);
  }
  form.add { display: flex; gap: 10px; }
  form.add input {
    flex: 1; min-width: 0;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 13px 15px;
    color: var(--text);
    font-size: 1rem;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  form.add input::placeholder { color: var(--muted); }
  form.add input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(129,140,248,0.25); }
  form.add button {
    border: none; border-radius: 12px; padding: 0 20px;
    font-size: 1.4rem; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    transition: transform .12s, opacity .12s;
  }
  form.add button:active { transform: scale(0.94); }
  .filters { display: flex; gap: 8px; margin: 18px 0 12px; }
  .filters button {
    flex: 1; padding: 8px 0; border-radius: 10px; border: 1px solid transparent;
    background: transparent; color: var(--muted); font-size: 0.9rem; font-weight: 600; cursor: pointer;
    transition: all .15s;
  }
  .filters button.active { background: rgba(129,140,248,0.16); border-color: rgba(129,140,248,0.4); color: var(--text); }
  ul.tasks { list-style: none; }
  li.task {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 12px; border-radius: 12px;
    animation: pop .18s ease;
  }
  li.task + li.task { margin-top: 4px; }
  li.task:hover { background: rgba(255,255,255,0.04); }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .check {
    flex: none; width: 24px; height: 24px; border-radius: 8px;
    border: 2px solid var(--muted); background: transparent; cursor: pointer;
    display: grid; place-items: center; color: transparent; font-size: 0.85rem;
    transition: all .15s;
  }
  li.task.done .check { background: linear-gradient(135deg, var(--accent), var(--accent2)); border-color: transparent; color: #fff; }
  .label { flex: 1; min-width: 0; font-size: 1rem; word-break: break-word; transition: color .15s; }
  li.task.done .label { color: var(--done); text-decoration: line-through; }
  .del {
    flex: none; border: none; background: transparent; color: var(--muted);
    font-size: 1.1rem; cursor: pointer; padding: 4px 8px; border-radius: 8px;
    transition: color .15s, background .15s;
  }
  .del:hover { color: var(--danger); background: rgba(248,113,113,0.12); }
  .empty { text-align: center; color: var(--muted); padding: 34px 0; font-size: 0.95rem; }
  .empty .big { font-size: 2rem; display: block; margin-bottom: 8px; }
  footer.bar { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; color: var(--muted); font-size: 0.85rem; }
  footer.bar button { background: none; border: none; color: var(--muted); font-size: 0.85rem; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  footer.bar button:hover { color: var(--text); }
  @media (max-width: 420px) {
    header h1 { font-size: 2rem; }
    .card { padding: 14px; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div class="date" id="dateLine"></div>
      <h1>My Tasks</h1>
    </header>
    <div class="card">
      <form class="add" id="addForm" autocomplete="off">
        <input type="text" id="newTask" placeholder="Add a new task..." maxlength="200" aria-label="New task">
        <button type="submit" aria-label="Add task">+</button>
      </form>
      <div class="filters" role="tablist">
        <button data-filter="all" class="active">All</button>
        <button data-filter="active">Active</button>
        <button data-filter="done">Done</button>
      </div>
      <ul class="tasks" id="taskList"></ul>
      <div class="empty" id="emptyState" hidden>
        <span class="big">&#127808;</span>
        <span id="emptyText">No tasks yet. Add your first one above.</span>
      </div>
      <footer class="bar">
        <span id="countLine">0 tasks</span>
        <button id="clearDone" type="button">Clear completed</button>
      </footer>
    </div>
  </div>

<script>
(function () {
  "use strict";
  var STORAGE_KEY = "todo.tasks.v1";
  var listEl = document.getElementById("taskList");
  var emptyEl = document.getElementById("emptyState");
  var emptyText = document.getElementById("emptyText");
  var countEl = document.getElementById("countLine");
  var form = document.getElementById("addForm");
  var input = document.getElementById("newTask");
  var clearBtn = document.getElementById("clearDone");
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll(".filters button"));
  var filter = "all";
  var tasks = load();

  document.getElementById("dateLine").textContent = new Date().toLocaleDateString(undefined, {
    weekday: "long", month: "long", day: "numeric"
  });

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      var parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed.filter(function (t) { return t && typeof t.text === "string"; }) : [];
    } catch (e) { return []; }
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks)); } catch (e) {}
  }
  function visible() {
    return tasks.filter(function (t) {
      if (filter === "active") return !t.done;
      if (filter === "done") return t.done;
      return true;
    });
  }
  function render() {
    var shown = visible();
    listEl.innerHTML = "";
    shown.forEach(function (t) {
      var li = document.createElement("li");
      li.className = "task" + (t.done ? " done" : "");

      var check = document.createElement("button");
      check.className = "check";
      check.type = "button";
      check.textContent = "\u2713";
      check.setAttribute("aria-label", t.done ? "Mark as not done" : "Mark as done");
      check.addEventListener("click", function () { toggle(t.id); });

      var label = document.createElement("span");
      label.className = "label";
      label.textContent = t.text;

      var del = document.createElement("button");
      del.className = "del";
      del.type = "button";
      del.textContent = "\u00d7";
      del.setAttribute("aria-label", "Delete task");
      del.addEventListener("click", function () { remove(t.id); });

      li.appendChild(check);
      li.appendChild(label);
      li.appendChild(del);
      listEl.appendChild(li);
    });

    if (shown.length === 0) {
      emptyEl.hidden = false;
      emptyText.textContent = tasks.length === 0
        ? "No tasks yet. Add your first one above."
        : (filter === "active" ? "Nothing left to do. Nice work." : "Nothing here yet.");
    } else {
      emptyEl.hidden = true;
    }

    var remaining = tasks.filter(function (t) { return !t.done; }).length;
    countEl.textContent = remaining + (remaining === 1 ? " task left" : " tasks left");
  }
  function add(text) {
    tasks.unshift({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7), text: text, done: false });
    save(); render();
  }
  function toggle(id) {
    tasks = tasks.map(function (t) { return t.id === id ? { id: t.id, text: t.text, done: !t.done } : t; });
    save(); render();
  }
  function remove(id) {
    tasks = tasks.filter(function (t) { return t.id !== id; });
    save(); render();
  }
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    var text = input.value.trim();
    if (!text) return;
    add(text);
    input.value = "";
    input.focus();
  });
  filterBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      filter = btn.getAttribute("data-filter");
      filterBtns.forEach(function (b) { b.classList.toggle("active", b === btn); });
      render();
    });
  });
  clearBtn.addEventListener("click", function () {
    tasks = tasks.filter(function (t) { return !t.done; });
    save(); render();
  });
  render();
})();
</script>
</body>
</html>
